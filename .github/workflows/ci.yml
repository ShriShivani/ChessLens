name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, tests, accuracy regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          # The headless build avoids needing libGL on the runner.
          pip uninstall -y opencv-python
          pip install opencv-python-headless
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy (best effort)
        run: mypy edge server
        continue-on-error: true
      - name: Tests
        run: pytest -q
      - name: Accuracy regression (synthetic)
        run: python -m tests.eval --json eval_synthetic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-synthetic
          path: eval_synthetic.json
          if-no-files-found: ignore

  web:
    name: Web lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: chesslens-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: chesslens-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Trivy scan (server)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: chesslens-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan (web)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: chesslens-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform fmt, validate, tfsec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
